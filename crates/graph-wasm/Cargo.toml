cargo-features = ["edition2024"]

[package]
name = "graph-wasm"
description = "Thin extern \"C\" glue over graph-core for wasm32. No wasm-bindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# cdylib: the .wasm the browser and the Node harness load.
# rlib: so graph-cli can run the very same probe code natively for the D1 comparison.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports `gm_probe` from the wasm module, for `graph-cli determinism-probe` only.
probe = []
# Browser threads model (a): the `gm_thread_*` and `gm_run_threaded` exports over one shared
# memory. Only `scripts/orch/wasm-threads.sh` turns it on, with `+atomics` and `-Z build-std`;
# the default artifact stays import-free (`refuseImports`).
threads = []

[dependencies]
graph-core = { path = "../graph-core" }
# Phase 4 (deviation, docs/contract/wasm-abi.md): the ABI's handle/column layer names
# graph_contract::binary::Snapshot and graph_contract::geometry directly. graph-core
# does not re-export them (`prompt.md` §3.1's crate boundary), so graph-wasm depends on
# graph-contract itself, default features only (no serde/schemars: `codegen` stays
# graph-cli's alone).
graph-contract = { path = "../graph-contract" }
libm = "0.2"

[lints]
workspace = true
