[package]
name = "graph-core"
description = "The graph-motor: pure graph and diagram geometry. No I/O, no clock, no bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The external dependency list is CLOSED (prompt.md §3.1): libm, indexmap, and
# petgraph from Phase 7. Adding anything else is a stop-and-ask. graph-contract is
# the workspace's own type crate, used with its default (dependency-free) features.
[dependencies]
graph-contract = { path = "../graph-contract", default-features = false }
indexmap = "2.14"
libm = "0.2"
# Phase 7 (`prompts/phase-07-analysis.md` step 1) put petgraph on the allow-list and
# `analysis/paths.rs` reuses `petgraph::algo::dijkstra` rather than a second shortest-path
# implementation. Phase 8's `post::routed` reuses the *same* function over the grid's own
# CSR, so the dependency and the pin are exactly Phase 7's, brought forward onto this
# branch's base (p8-route forked from p3, before p7 landed). `default-features = false`
# drops only `std`-gated containers (`graphmap`/`stable_graph`/`matrix_graph`): we
# implement petgraph's traits on our own CSR and never build a petgraph container, so
# none of its own graph types are wanted.
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }

[lints]
workspace = true
