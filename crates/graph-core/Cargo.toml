cargo-features = ["edition2024"]

[package]
name = "graph-core"
description = "The graph-motor: pure graph and diagram geometry. No I/O, no clock, no bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The external dependency list is CLOSED (prompt.md §3.1): libm, indexmap, and
# petgraph from Phase 7. Adding anything else is a stop-and-ask. graph-contract is
# the workspace's own type crate, used with its default (dependency-free) features.
[dependencies]
graph-contract = { path = "../graph-contract", default-features = false }
indexmap = "2.14"
libm = "0.2"
# Phase 7 (prompts/phase-07-analysis.md): the allow-list's one addition, pinned exactly
# and released well over the house's 7-day hold (0.8.3: 2025-09-30). `default-features =
# false` then only `std` drops `graphmap`/`stable_graph`/`matrix_graph` — we implement
# petgraph's traits on our own CSR (csr_petgraph.rs) and never build a petgraph
# container, so none of its own graph types are wanted.
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }

[lints]
workspace = true
