cargo-features = ["edition2024"]

[package]
name = "graph-contract"
description = "The graph-motor wire format: geometry vocabulary, snapshot header, codegen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Default features are empty on purpose: graph-core and graph-wasm depend on this
# crate, and the closed graph-core allow-list (libm, indexmap, petgraph) must not
# grow a serializer through the back door. Only graph-cli turns `codegen` on.
[features]
default = []
codegen = ["dep:serde", "dep:schemars", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[lints]
workspace = true
