# cargo-mutants settings for the per-phase mutation run (ONBOARDING §6.2):
#   docker run --rm -v "$PWD:/w" ge-mutants cargo mutants --in-diff phase.diff
#
# The gate is "no surviving mutant in new code, or a written reason per exception".
# Every exclusion below is such an exception and carries its reason; add to this list
# only with one.

# The codegen module and its tests exist only with the `codegen` feature.
all_features = true

# Integration tests in one crate (graph-cli/tests/cli.rs) are what exercise the others'
# process glue, so every mutant is tested against the whole workspace.
test_workspace = true

exclude_re = [
    # wasm32-only: `graph_wasm::exports` is not compiled for the native test run, so no
    # native test can reach it. It is exercised by the hash gate's wasm arm, which fails
    # to read a mis-framed buffer (graph-cli/tests/cli.rs, hashgate test).
    "exports::publish",
    # Equivalent: in `probe::from_bits` the shifted exponent and the masked mantissa
    # occupy disjoint bits, so `|` and `^` compute the same value for every input.
    "replace \\| with \\^ in from_bits",
    # Equivalent by construction: `StageCount::ONE` is the only value that can exist, so
    # `get` returns 1 for every input it can ever receive.
    "replace StageCount::get -> u32 with 1",
    # Equivalent: `empty_model` is `Topology::default()`, so the mutant is the original.
    "replace empty_model -> Topology with Default::default\\(\\)",
    # Equivalent in output: deleting `nodes`/`edges` from the struct literal in
    # `index_model` only drops the up-front reservation; the columns then grow on push
    # and hold the same values. The reservation itself is pinned by
    # `columns::tests::with_capacity_reserves_room_in_every_column`.
    "delete field (nodes|edges) from struct Topology expression in index_model",
    # Equivalent on every reachable input: mulberry32 draws k / 2^32 for a u32 k, so a
    # draw never equals 0.6 or 0.8 (neither is a multiple of 2^-32), and it equals 0.5
    # only when k = 2^31, which none of the first 1 000 000 draws from the synthetic seed
    # does, and the 100 000-node model, the largest, uses fewer (both pinned by
    # `synthetic::tests::no_draw_a_synthetic_model_can_reach_is_exactly_one_half`). `<`
    # and `<=` therefore choose the same branch for every model the oracle can build.
    "replace < with <= in synthetic_(node|edges)",
]
