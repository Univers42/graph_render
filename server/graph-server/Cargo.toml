[package]
name = "graph-server"
description = "graph-motor as an HTTP microservice: the compute API and the embed assets."
# Kept equal to the motor workspace's version: `/v1/meta` reports it.
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

# Every external crate is pinned exactly (`=`): a service over untrusted input moves a
# dependency on purpose, in a reviewed commit, never through a resolver run. hyper,
# hyper-util, http-body-util and tower are axum's own dependencies at the versions it
# resolves, named here only for the knobs axum does not expose.
[dependencies]
graph-contract = { path = "../../crates/graph-contract" }
graph-core = { path = "../../crates/graph-core" }
# Default features only: `probe` is a data race natively and `threads` is the browser's
# shared-memory build (docs/contract/service-api.md "Verdict", condition 1; row svc-features).
graph-wasm = { path = "../../crates/graph-wasm" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
http-body-util = "=0.1.5"
# Decodes the query string; already in the lock through axum.
percent-encoding = "=2.3.2"
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "server", "server-graceful", "service", "http1"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false, features = ["std"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "signal", "time", "sync", "io-util", "macros"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in the integration tests.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[features]
# The negative controls' server-side breaks (`src/breaks.rs`). Off in every shipped build.
negctl = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
