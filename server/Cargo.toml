# The service's own workspace (`docs/decisions/server-and-write-path.md`): it reaches the motor
# by path and nothing under `crates/` reaches it, so the motor's merge floor never builds a web
# stack. Its second lockfile is what `scripts/orch/lock-parity.sh` holds to the root one for
# every crate graph-core links.
[workspace]
resolver = "2"
members = ["graph-server"]

# Verdict condition 5: a panic in a run must unwind into a JoinError and a 500, never abort the
# process with every other request in flight. Set on the workspace: member profiles are ignored.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
